<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-sys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181308"/>
      <stop offset="100%" stop-color="#080602"/>
    </linearGradient>
    <linearGradient id="neon-sys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-sys)"/>
  <!-- Circuit / CPU grid -->
  <rect x="340" y="110" width="120" height="120" rx="10" fill="#241b07" stroke="url(#neon-sys)" stroke-width="2.5"/>
  <text x="365" y="175" fill="#ffb703" font-family="'Share Tech Mono', monospace" font-size="20">SYS://01</text>
  <line x1="300" y1="140" x2="340" y2="140" stroke="#ffb703" stroke-width="2"/>
  <line x1="300" y1="170" x2="340" y2="170" stroke="#ffb703" stroke-width="2"/>
  <line x1="300" y1="200" x2="340" y2="200" stroke="#ffb703" stroke-width="2"/>
  <line x1="460" y1="140" x2="500" y2="140" stroke="#fb8500" stroke-width="2"/>
  <line x1="460" y1="170" x2="500" y2="170" stroke="#fb8500" stroke-width="2"/>
  <line x1="460" y1="200" x2="500" y2="200" stroke="#fb8500" stroke-width="2"/>
  <!-- UI Card Header -->
  <rect x="180" y="320" width="440" height="90" rx="8" fill="#201705" stroke="#4a360a" stroke-width="1"/>
  <text x="210" y="355" fill="#ffb703" font-family="'Space Grotesk', monospace" font-size="18" font-weight="bold">HIGH-PERFORMANCE ENGINE</text>
  <text x="210" y="385" fill="#c4aa79" font-family="'Space Grotesk', sans-serif" font-size="13">Low-latency data processing engine with optimized memory management</text>
</svg>
