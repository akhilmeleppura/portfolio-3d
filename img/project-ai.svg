<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d081c"/>
      <stop offset="100%" stop-color="#05030b"/>
    </linearGradient>
    <linearGradient id="neon-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-ai)"/>
  <!-- Neural graph -->
  <line x1="280" y1="180" x2="380" y2="150" stroke="#ff007f" stroke-width="2" opacity="0.6"/>
  <line x1="280" y1="240" x2="380" y2="150" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <line x1="280" y1="240" x2="380" y2="250" stroke="#ff007f" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="150" x2="500" y2="200" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <line x1="380" y1="250" x2="500" y2="200" stroke="#ff007f" stroke-width="2.5" opacity="0.8"/>
  <circle cx="280" cy="180" r="10" fill="#00f0ff"/>
  <circle cx="280" cy="240" r="10" fill="#ff007f"/>
  <circle cx="380" cy="150" r="14" fill="#7000ff"/>
  <circle cx="380" cy="250" r="14" fill="#00f0ff"/>
  <circle cx="500" cy="200" r="20" fill="url(#neon-ai)"/>
  <!-- UI Card Header -->
  <rect x="180" y="320" width="440" height="90" rx="8" fill="#181128" stroke="#31224f" stroke-width="1"/>
  <text x="210" y="355" fill="#ff007f" font-family="'Space Grotesk', monospace" font-size="18" font-weight="bold">AI INTELLIGENCE PLATFORM</text>
  <text x="210" y="385" fill="#a49fc4" font-family="'Space Grotesk', sans-serif" font-size="13">Autonomous agent pipeline with LLM orchestration and RAG</text>
</svg>
