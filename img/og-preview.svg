<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180d32" />
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,240,255,0.6)" />
      <stop offset="100%" stop-color="rgba(168,85,247,0.4)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing accents -->
  <circle cx="200" cy="150" r="220" fill="#00f0ff" opacity="0.08" filter="blur(80px)" />
  <circle cx="1050" cy="450" r="260" fill="#7000ff" opacity="0.12" filter="blur(90px)" />

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="url(#card-border)" stroke-width="2" opacity="0.7" />

  <!-- Badge: Immediate Joiner -->
  <rect x="80" y="80" width="220" height="38" rx="19" fill="rgba(0,245,160,0.12)" stroke="#00f5a0" stroke-width="1.5" />
  <circle cx="102" cy="99" r="5" fill="#00f5a0" />
  <text x="118" y="104" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#00f5a0" letter-spacing="1">⚡ IMMEDIATE JOINER</text>

  <!-- Subdomain badge -->
  <rect x="880" y="80" width="240" height="38" rx="19" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" />
  <text x="1000" y="104" font-family="-apple-system, monospace" font-size="13" fill="#00f0ff" text-anchor="middle">akhil-meleppura.is-a.dev</text>

  <!-- Main Name Heading -->
  <text x="80" y="220" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    AKHIL MELEPPURA
  </text>

  <!-- Title Subheading -->
  <text x="80" y="278" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="30" fill="url(#cyan-purple)" letter-spacing="0.5">
    Senior Backend Laravel &amp; PHP Developer (3+ Years)
  </text>

  <!-- Description paragraph -->
  <text x="80" y="335" font-family="-apple-system, sans-serif" font-size="20" fill="#94a3b8" width="1000">
    Building high-scale retail architectures (AK-MART, Mini Mart), real-time delivery tracking,
  </text>
  <text x="80" y="365" font-family="-apple-system, sans-serif" font-size="20" fill="#94a3b8">
    RESTful APIs, MySQL optimization, and background queue workflows. Palakkad, Kerala.
  </text>

  <!-- Skill Badges -->
  <g transform="translate(80, 420)">
    <!-- Laravel -->
    <rect x="0" y="0" width="140" height="42" rx="10" fill="rgba(255,45,32,0.15)" stroke="rgba(255,45,32,0.5)" stroke-width="1.5" />
    <text x="70" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#ff5c5c" text-anchor="middle">Laravel 11/12</text>

    <!-- PHP 8.x -->
    <rect x="155" y="0" width="120" height="42" rx="10" fill="rgba(119,123,179,0.15)" stroke="rgba(119,123,179,0.5)" stroke-width="1.5" />
    <text x="215" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#a5b4fc" text-anchor="middle">PHP 8.x</text>

    <!-- MySQL -->
    <rect x="290" y="0" width="130" height="42" rx="10" fill="rgba(0,117,143,0.18)" stroke="rgba(0,117,143,0.5)" stroke-width="1.5" />
    <text x="355" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#38bdf8" text-anchor="middle">MySQL Opt</text>

    <!-- Redis -->
    <rect x="435" y="0" width="130" height="42" rx="10" fill="rgba(220,56,45,0.15)" stroke="rgba(220,56,45,0.5)" stroke-width="1.5" />
    <text x="500" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#f87171" text-anchor="middle">Redis Queues</text>

    <!-- REST APIs -->
    <rect x="580" y="0" width="135" height="42" rx="10" fill="rgba(0,240,255,0.15)" stroke="rgba(0,240,255,0.5)" stroke-width="1.5" />
    <text x="647" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#00f0ff" text-anchor="middle">RESTful APIs</text>

    <!-- Docker -->
    <rect x="730" y="0" width="110" height="42" rx="10" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.5)" stroke-width="1.5" />
    <text x="785" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#7dd3fc" text-anchor="middle">Docker</text>
  </g>

  <!-- Footer Info -->
  <line x1="80" y1="510" x2="1120" y2="510" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="80" y="550" font-family="-apple-system, sans-serif" font-size="15" fill="#64748b">
    📍 Palakkad, Kerala, India  •  📞 +91 79022 07027  •  ✉️ akhilmeleppura@gmail.com
  </text>
  <text x="1120" y="550" font-family="-apple-system, sans-serif" font-size="15" fill="#00f0ff" text-anchor="end">
    Interactive 3D Portfolio &amp; AI Chatbot ⚡
  </text>
</svg>
