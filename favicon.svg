<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a101c" stroke="#00f0ff" stroke-width="2" />
  <!-- Circuit Accent Lines -->
  <path d="M8 20 L20 20 L24 24" fill="none" stroke="rgba(0,240,255,0.4)" stroke-width="1.5" />
  <path d="M56 44 L44 44 L40 40" fill="none" stroke="rgba(112,0,255,0.5)" stroke-width="1.5" />
  <!-- AM Cyber Monogram -->
  <text x="32" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="26" fill="url(#cyber-grad)" text-anchor="middle" letter-spacing="1" filter="url(#neon-glow)">AM</text>
  <!-- Cyberpunk corner accent dots -->
  <circle cx="12" cy="12" r="2" fill="#00f5a0" />
  <circle cx="52" cy="52" r="2" fill="#00f0ff" />
</svg>
